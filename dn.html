<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - FitLife VN</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../code_css/dn.css">
    
    <script src="../code_js/dn.js"></script>
</head>
<body>
    
    <header>
        <nav id="thanh-dieu-huong">
            <div class="noi-dung-nav">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-heart-pulse"></i>
                    <span>Fit<span>Life</span>VN</span>
                </a>
                <div class="cac-lien-ket">
                    <a href="index.html">Trang chủ</a>
                    <div class="phien-dang-nhap">
                        <a href="dn.html" class="nut-dang-nhap">Đăng nhập</a>
                        <a href="dk.html">Đăng ký</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    
    <main class="noi-dung-chinh">
        <div class="anh-nen">
            <img src="https://images.unsplash.com/photo-1599058945522-28d584b6f0ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80" alt="Nền Yoga">
            <div class="lop-nen-mo"></div>
        </div>

        <div class="khung-dang-nhap">
            <div class="tieu-de-form">
                <h2>Chào mừng trở lại!</h2>
                <p>Đăng nhập để tiếp tục hành trình</p>
            </div>

            <div class="noi-dung-form">
                <form id="form-dang-nhap">
                    <div class="nhom-input">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="example@email.com" required>
                    </div>
                    <div class="nhom-input">
                        <label for="mat-khau">Mật khẩu</label>
                        <input type="password" id="mat-khau" placeholder="••••••••" required>
                    </div>
                    <div class="khung-quen-mk">
                        <a href="#" id="nut-quen-mk">Quên mật khẩu?</a>
                    </div>
                    <button type="submit" class="nut-gui">Đăng nhập</button>
                </form>

                <div class="khung-chuyen-trang">
                    <p>Chưa có tài khoản? <a href="dk.html">Đăng ký ngay</a></p>
                </div>
            </div>
        </div>
    </main>

    
    <footer class="chan-trang">
        <div class="noi-dung-chan-trang">
            
            <p>&copy; 2023 FitLife Vietnam. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
